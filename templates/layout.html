<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ResuMate · Resume analysis{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bf0'/%3E%3Cpath d='M9 17l5 5 9-11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="{{ url_for('index') }}">
      <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b5bf0"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg)"/><path d="M9 17l5 5 9-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      ResuMate
    </a>
    <span class="tag">Know exactly what to fix</span>
  </header>
  <main id="app">{% block content %}{% endblock %}</main>
</div>

<div class="loading" id="loading" role="status" aria-live="polite">
  <div class="loader">
    <svg class="spin" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="spinGrad"><stop offset="0" stop-color="#5b5bf0"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><circle class="t" cx="50" cy="50" r="40"/><circle class="p" cx="50" cy="50" r="40"/></svg>
    <h2 class="loadtitle">Evaluating your resume…</h2>
    <div class="status" id="status">Reading your resume</div>
    <div class="loadbar"><i id="loadbar"></i></div>
    <div class="muted small">Your file stays in memory and is never stored</div>
  </div>
</div>
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>

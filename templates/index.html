<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ResuMate · Resume analysis</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main>
  <h1>ResuMate</h1>
  <p class="sub">Upload a resume to get a score out of 100, the fixes that gain the most points, suggested roles, and how well it matches a job post.</p>
  <form class="card" method="post" action="{{ url_for('analyze_page') }}" enctype="multipart/form-data">
    <label for="resume">Resume (PDF, Word .docx or text, up to 5 MB)</label>
    <input id="resume" type="file" name="resume" accept=".pdf,.docx,.txt" required>
    <label for="job">Job description (optional, to see how well the resume matches it)</label>
    <textarea id="job" name="job" placeholder="Paste the job post here"></textarea>
    <button type="submit">Analyse resume</button>
    <p class="note">Your file is read in memory and not stored.</p>
  </form>
  {% if error %}<div class="card error">{{ error }}</div>{% endif %}
</main>
</body>
</html>
